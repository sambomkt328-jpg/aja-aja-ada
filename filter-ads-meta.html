<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EDUTOTO Ads Filter</title>

  <style>
    :root{--bg:#09090e;--card:rgba(25,25,33,.78);--line:rgba(255,255,255,.13);--text:#f8f7ff;--muted:#aaa9bb;--gold:#ffd45a;--gold-light:#fff0ba;--red:#ff8678;--green:#56e7a8;--blue:#61cfff;--yellow:#ffe084}
    *{box-sizing:border-box}
    body{margin:0;min-width:320px;color:var(--text);font:14px Arial,sans-serif;background:radial-gradient(circle at 6% 4%,rgba(168,85,247,.16),transparent 25%),radial-gradient(circle at 92% 20%,rgba(255,205,77,.12),transparent 23%),var(--bg)}
    main{max-width:1500px;margin:auto;padding:45px 20px 65px}
    h1{margin:0;color:var(--gold-light);font-size:clamp(29px,4vw,46px);letter-spacing:-1.8px}h1 span,b{color:var(--gold)}
    .sub{max-width:690px;margin:12px 0 28px;color:var(--muted);line-height:1.6}.sub b{color:var(--gold-light)}
    .card{background:linear-gradient(145deg,rgba(31,30,40,.86),rgba(17,17,23,.88));border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 18px 40px rgba(0,0,0,.16);backdrop-filter:blur(14px)}
    textarea{display:block;width:100%;min-height:300px;resize:vertical;background:rgba(7,7,11,.72);color:#fff;border:1px solid #464553;border-radius:14px;padding:14px;font:12px/1.55 Consolas,monospace;outline:0;transition:.2s}textarea:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(255,212,90,.12)}textarea::placeholder{color:#757383}
    .bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:15px}.field{display:grid;gap:7px;color:#b9b7c2;font-size:11px;font-weight:700}.field input,.field select{width:132px;padding:11px;background:#111116;color:#fff;border:1px solid #484650;border-radius:10px;outline:0;transition:.18s}.field select{width:164px}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,212,90,.1)}
    button{position:relative;overflow:hidden;isolation:isolate;border:1px solid #55515e;border-radius:11px;padding:12px 16px;background:#27262d;color:#fff;font-weight:900;cursor:pointer;transition:transform .16s,box-shadow .16s,background .16s}button:hover{transform:translateY(-3px);background:#37353e;box-shadow:0 10px 22px #0007}button:active{transform:translateY(1px) scale(.97);box-shadow:none}button::after{content:"";position:absolute;z-index:-1;top:50%;left:50%;width:0;height:0;border-radius:50%;background:#ffffff3b;transform:translate(-50%,-50%);transition:width .42s,height .42s}button:active::after{width:260px;height:260px}button.primary{border:0;background:linear-gradient(135deg,#ffe99f,var(--gold));color:#211803;box-shadow:0 6px 18px rgba(255,210,73,.22)}button.primary:hover{background:linear-gradient(135deg,#fff1b8,#f5c640);box-shadow:0 12px 27px rgba(255,210,73,.34)}
    .summary{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:11px;margin-bottom:18px}.sum{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;padding:14px;background:linear-gradient(145deg,#1d1c24,#121217);transition:transform .18s,border-color .18s}.sum:hover{transform:translateY(-3px);border-color:rgba(255,212,90,.48)}.sum small{color:var(--muted);font-size:10px;font-weight:800}.sum b{display:block;margin-top:7px;font-size:23px;letter-spacing:-.5px}
    .table-wrap{overflow:auto;max-height:620px;border:1px solid #393742;border-radius:14px;-webkit-overflow-scrolling:touch;scrollbar-color:#777380 #1b1a20;scrollbar-width:thin}table{border-collapse:collapse;width:100%;min-width:1130px;background:#141419}th,td{padding:12px 10px;border-bottom:1px solid #302f36;text-align:left;vertical-align:top}th{position:sticky;top:0;z-index:1;background:#25242c;color:var(--gold-light);font-size:11px;box-shadow:0 1px 0 #4b4854}tr:hover td{background:#201f26}.name{min-width:300px;font-weight:bold}.meta,.note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:6px}.note{max-width:260px}.money{white-space:nowrap;font-variant-numeric:tabular-nums}.pct{font-weight:bold}.badge{display:inline-block;border:1px solid transparent;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;letter-spacing:.25px;white-space:nowrap}.mahal{background:#4b1d27;border-color:#8b3d49;color:#ffb1b7}.hold-history{background:#4c3c16;border-color:#856e34;color:#ffe391}.hold{background:#40351c;border-color:#716136;color:#ffe28d}.go{background:#123e2d;border-color:#2e8260;color:#9cf3c7}.watch{background:#1a3555;border-color:#3775ad;color:#b6d9ff}.active{background:#303541;border-color:#525d70;color:#dce4ef}.scheduled{background:#40371c;border-color:#706139;color:#ffe28e}.danger{background:#28141a}.danger td{border-color:#5a2d37}.danger .name{color:#ffc1c6}.empty{text-align:center;color:var(--muted);padding:28px}
    @media(max-width:700px){main{padding:28px 12px 45px}.summary{grid-template-columns:repeat(2,1fr)}h1{letter-spacing:-1px}.bar{display:grid;grid-template-columns:1fr 1fr}.bar>*{min-width:0}.field input,.field select{width:100%}.bar button{min-height:45px}.card{padding:14px;border-radius:16px}textarea{min-height:245px}.table-wrap{max-height:480px}}
  </style>
</head>

<body>
<main>
  <h1>FILTER <span>IKLAN ADS MKT328</span></h1>
  
  </p>

  <section class="card">
    <textarea id="raw" placeholder="Paste data RAW campaign di sini..."></textarea>

    <div class="bar">
      <label class="field">
        CPR mahal di atas
        <input id="cprLimit" type="number" value="5" step=".01">
      </label>

      <label class="field">
        Mulai cek mahal (%)
        <input id="earlyPct" type="number" value="9" step="1">
      </label>

      <label class="field">
        Batas lanjut (%)
        <input id="goPct" type="number" value="20" step="1">
      </label>

      <label class="field">
        Pengecualian setelah (%)
        <input id="historyPct" type="number" value="15" step="1">
      </label>

      <label class="field">
        CPR MAX murah di bawah
        <input id="historyCpr" type="number" value="4" step=".01">
      </label>

      <label class="field">
        Filter situs
        <select id="siteFilter">
          <option value="ALL">Semua situs</option>
          <option value="EDUTOTO">EDUTOTO</option>
          <option value="AMPER88">AMPER88</option>
          <option value="SHOPISLOT">SHOPISLOT</option>
          <option value="LAINNYA">LAINNYA</option>
        </select>
      </label>

      <label class="field">
        Cari No Akun
        <input id="accountFilter" type="search" placeholder="Contoh: 1281">
      </label>

      <button class="primary" id="process">⚡ FILTER SEKARANG</button>
      <button id="clear">✕ HAPUS DATA</button>
    </div>
  </section>

  <section class="summary" id="summary"></section>

  <section class="card" style="padding:12px">
    <b>HASIL FILTER IKLAN ADS</b>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>No Akun</th>
            <th>Situs / Agency</th>
            <th>Campaign & Link</th>
            <th>Budget</th>
            <th>Spend Saat Ini</th>
            <th>% Budget</th>
            <th>Result</th>
            <th>CPR Saat Ini</th>
            <th>CPR Max</th>
            <th>CPM</th>
            <th>CPC</th>
            <th>Penjelasan</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  const money = number => Number.isFinite(number)
    ? '$' + number.toLocaleString('en-US',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    : '—';

  function num(value){
    if(value == null) return null;

    const text = String(value)
      .replace(/[$,\s]/g,'')
      .trim();

    if(
      !text ||
      /active|scheduled|preparing|pending|review/i.test(text)
    ){
      return null;
    }

    const parsed = parseFloat(text);

    return Number.isFinite(parsed) ? parsed : null;
  }

  function valueOf(block,label){
    const escaped = label.replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

    const regex = new RegExp(
      '(?:^|\\n)\\s*' + escaped + '\\s*:\\s*([^\\n\\r]*)',
      'i'
    );

    const match = block.match(regex);

    return match ? match[1].trim() : '';
  }

  function detectSite(text){
    const upper = String(text).toUpperCase();

    if(
      upper.includes('EDUTOTO') ||
      upper.includes('ZUMYXEDU') ||
      upper.includes('EDU GMT')
    ){
      return 'EDUTOTO';
    }

    if(upper.includes('AMPER88') || /^AMP/i.test(upper)){
      return 'AMPER88';
    }

    if(upper.includes('SHOPISLOT') || /^SHP/i.test(upper)){
      return 'SHOPISLOT';
    }

    return 'LAINNYA';
  }

  function detectAgency(firstLine){
    const upper = firstLine.toUpperCase();

    if(upper.startsWith('EDUTOTOXBGPM')) return 'BGPM';
    if(upper.startsWith('EDUTOTOXLUNA')) return 'LUNA';
    if(upper.startsWith('ZUMYXEDU')) return 'ZUMY';

    const beforeGmt = firstLine.split(/GMT/i)[0].trim();

    return beforeGmt || '—';
  }

  function parse(raw){
    const lines = raw.split(/\r?\n/);

    /*
      Campaign baru dimulai jika dalam baris ada nomor akun:
      (1281), (0041), (4157), dan lainnya.
    */
    const startIndexes = [];

    lines.forEach((line,index) => {
      if(/\(\s*\d{3,8}\s*\)/.test(line)){
        startIndexes.push(index);
      }
    });

    if(!startIndexes.length) return [];

    const output = [];

    startIndexes.forEach((start,index) => {
      const end = startIndexes[index + 1] || lines.length;
      const block = lines.slice(start,end).join('\n').trim();

      if(!block) return;

      const first = lines[start].trim();
      const accountMatch = first.match(/\(\s*(\d{3,8})\s*\)/);

      if(!accountMatch) return;

      const account = accountMatch[1];
      const site = detectSite(first);
      const agency = detectAgency(first);

      const gmtMatch = first.match(/GMT\s*([+-]\s*\d+)/i);

      const gmt = gmtMatch
        ? gmtMatch[1].replace(/\s/g,'')
        : '—';

      /*
        Budget mengambil nominal dolar pertama pada judul campaign.
        Contoh:
        (1281) $1000 REV...
        (7037) BC $4.5 $1000...
      */
      const moneyMatches = [
        ...first.matchAll(/\$\s*([\d,.]+)/g)
      ];

      const budget = moneyMatches.length
        ? num(moneyMatches[0][1])
        : null;

      const spendMaxText = valueOf(block,'SPEND MAX');
      const statusText = [
        valueOf(block,'STATUS'),
        valueOf(block,'ON/OFF'),
        spendMaxText
      ].join(' ');

      const inactive = /\b(?:off|disabled)\b/i.test(
        first + ' ' + statusText
      );

      if(inactive) return;

      const link = (
        block.match(/LINK ADS\s*:\s*(https?:\/\/\S+)/i) || []
      )[1] || '';

      output.push({
        first,
        account,
        site,
        agency,
        gmt,
        budget,
        spend:num(valueOf(block,'SPEND')),
        cpr:num(valueOf(block,'CPR')),
        cprMax:num(valueOf(block,'CPR MAX')),
        result:num(valueOf(block,'RESULT')),
        cpm:num(valueOf(block,'CPM')),
        cpc:num(valueOf(block,'CPC')),
        link,
        active:/active/i.test(spendMaxText),
        preparing:/preparing/i.test(spendMaxText),
        scheduled:/scheduled/i.test(spendMaxText),
        review:/review|in review/i.test(statusText)
      });
    });

    return output;
  }

  function settings(){
    return {
      limit:+$('cprLimit').value || 5,
      early:(+$('earlyPct').value || 9) / 100,
      go:(+$('goPct').value || 20) / 100,
      hist:(+$('historyPct').value || 15) / 100,
      histCpr:+$('historyCpr').value || 4
    };
  }

  function status(item,setting){
    if(item.scheduled){
      return {
        key:'scheduled',
        label:'SCHEDULED',
        note:'Campaign sudah dijadwalkan dan belum mulai spend.'
      };
    }

    if(item.review){
      return {
        key:'watch',
        label:'IN REVIEW',
        note:'Campaign sedang dalam proses review.'
      };
    }

    if(item.spend === null || item.spend === 0){
      return {
        key:'active',
        label:item.preparing
          ? 'PREPARING'
          : item.active
            ? 'ACTIVE — BELUM ADA SPEND'
            : 'BELUM ADA DATA',
        note:'Belum ada spend atau CPR untuk dianalisis.'
      };
    }

    const percentBudget = item.budget
      ? item.spend / item.budget
      : null;

    if(
      percentBudget !== null &&
      percentBudget >= .10 &&
      item.cpr === null
    ){
      return {
        key:'mahal',
        label:'IKLAN MAHAL',
        note:'Spend sudah 10% budget, tetapi CPR belum keluar.'
      };
    }

    if(!item.result || item.result <= 0){
      return {
        key:'watch',
        label:'BELUM ADA HASIL',
        note:'Spend sudah jalan, tetapi result belum muncul.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget > setting.hist &&
      item.cpr > setting.limit &&
      item.cprMax !== null &&
      item.cprMax < setting.histCpr
    ){
      return {
        key:'hold-history',
        label:'TAHAN DULU',
        note:'Kemarin masih dapat murah: CPR MAX ' +
          money(item.cprMax) + '.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= setting.early &&
      item.cpr > setting.limit
    ){
      return {
        key:'mahal',
        label:'IKLAN MAHAL',
        note:'CPR ' + money(item.cpr) +
          ' di atas batas ' + money(setting.limit) + '.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= setting.go &&
      item.cpr <= setting.limit
    ){
      return {
        key:'go',
        label:'LANJUTKAN',
        note:'Lolos evaluasi ' +
          Math.round(setting.go * 100) +
          '% budget dengan CPR aman.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= .10 &&
      item.cpr <= setting.limit
    ){
      return {
        key:'hold',
        label:'TAHAN DULU',
        note:'CPR aman. Tahan sampai ' +
          Math.round(setting.go * 100) +
          '% budget.'
      };
    }

    return {
      key:'watch',
      label:'PANTAU',
      note:percentBudget === null
        ? 'Budget tidak terbaca.'
        : 'Spend belum masuk batas evaluasi.'
    };
  }

  function run(){
    const setting = settings();
    const selectedSite = $('siteFilter').value;
    const accountQuery = $('accountFilter').value.trim();

    let data = parse($('raw').value).map(item => ({
      ...item,
      st:status(item,setting)
    }));

    if(selectedSite !== 'ALL'){
      data = data.filter(item => item.site === selectedSite);
    }

    if(accountQuery){
      data = data.filter(item =>
        item.account.includes(accountQuery)
      );
    }

    const ranking = {
      mahal:0,
      'hold-history':1,
      hold:2,
      watch:3,
      go:4,
      scheduled:5,
      active:6
    };

    data.sort((a,b) =>
      ranking[a.st.key] - ranking[b.st.key] ||
      (b.cpr ?? -1) - (a.cpr ?? -1)
    );

    const totalSpend = data.reduce(
      (total,item) => total + (item.spend || 0),
      0
    );

    const expensiveCount = data.filter(
      item => item.st.key === 'mahal'
    ).length;

    const holdCount = data.filter(
      item =>
        item.st.key === 'hold-history' ||
        item.st.key === 'hold'
    ).length;

    const continueCount = data.filter(
      item => item.st.key === 'go'
    ).length;

    $('summary').innerHTML = [
      ['CAMPAIGN TERBACA',data.length,''],
      ['TOTAL SPEND',money(totalSpend),''],
      ['IKLAN MAHAL',expensiveCount,'color:var(--red)'],
      ['TAHAN DULU',holdCount,'color:var(--yellow)'],
      ['LANJUTKAN',continueCount,'color:var(--green)']
    ].map(item => `
      <div class="sum">
        <small>${item[0]}</small>
        <b style="${item[2]}">${item[1]}</b>
      </div>
    `).join('');

    $('rows').innerHTML = data.length
      ? data.map(item => {
          const percentBudget =
            item.budget && item.spend !== null
              ? item.spend / item.budget
              : null;

          const blank = value =>
            Number.isFinite(value) ? money(value) : '';

          const campaign = item.first.replace(/</g,'&lt;');

          const cprColor = item.cpr > setting.limit
            ? 'var(--red)'
            : item.cpr > 0
              ? 'var(--green)'
              : 'var(--muted)';

          return `
            <tr class="${item.st.key === 'mahal' ? 'danger' : ''}">
              <td>
                <span class="badge ${item.st.key}">
                  ${item.st.label}
                </span>
              </td>

              <td>
                <b style="font-size:16px">${item.account}</b>
                <div class="meta">GMT ${item.gmt}</div>
              </td>

              <td>
                <b>${item.site}</b>
                <div class="meta">Agency: ${item.agency}</div>
              </td>

              <td class="name">
                ${campaign}
                <div class="meta">
                  ${
                    item.link
                      ? `<a href="${item.link}" target="_blank" rel="noreferrer" style="color:#8bbcff">${item.link}</a>`
                      : 'Link tidak ada'
                  }
                </div>
              </td>

              <td class="money">${blank(item.budget)}</td>

              <td class="money">
                ${
                  item.scheduled
                    ? 'SCHEDULED'
                    : item.preparing && item.spend === null
                      ? 'PREPARING'
                      : item.active && item.spend === null
                        ? 'ACTIVE'
                        : blank(item.spend)
                }
              </td>

              <td class="pct">
                ${
                  percentBudget === null
                    ? ''
                    : (percentBudget * 100).toFixed(2) + '%'
                }
              </td>

              <td>${item.result ?? ''}</td>

              <td class="money" style="color:${cprColor}">
                <b>${blank(item.cpr)}</b>
              </td>

              <td class="money">${blank(item.cprMax)}</td>
              <td class="money">${blank(item.cpm)}</td>
              <td class="money">${blank(item.cpc)}</td>

              <td>
                <div class="note">${item.st.note}</div>
              </td>
            </tr>
          `;
        }).join('')
      : `
        <tr>
          <td colspan="13" class="empty">
            Data tidak terbaca. Pastikan setiap campaign memiliki nomor akun,
            misalnya: (1281), (0041), atau (4157).
          </td>
        </tr>
      `;

    localStorage.setItem('adsFilterRaw',$('raw').value);
  }

  $('process').onclick = run;

  $('clear').onclick = () => {
    $('raw').value = '';
    localStorage.removeItem('adsFilterRaw');
    run();
  };

  $('siteFilter').onchange = run;
  $('accountFilter').oninput = run;

  $('raw').value = localStorage.getItem('adsFilterRaw') || '';

  run();
</script>
</body>
</html>
