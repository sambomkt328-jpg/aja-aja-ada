<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EDUTOTO Ads Filter</title>

  <style>
    :root{
      --bg:#0d0d0e;
      --card:#18181c;
      --line:#3d3c40;
      --text:#fff;
      --muted:#aaa;
      --gold:#f0c85f;
      --gold-light:#fff0b6;
      --red:#ff7562;
      --green:#5ed9a1;
      --blue:#5ed9ff;
      --yellow:#ffd86d;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font:14px Arial,sans-serif;
    }

    main{
      max-width:1500px;
      margin:auto;
      padding:28px 20px 60px;
    }

    h1{
      margin:0;
      color:var(--gold-light);
      font-size:28px;
    }

    h1 span,b{color:var(--gold)}

    .sub{
      margin:8px 0 22px;
      color:var(--muted);
      line-height:1.5;
    }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:17px;
      margin-bottom:18px;
    }

    textarea{
      width:100%;
      min-height:300px;
      resize:vertical;
      background:#101012;
      color:#fff;
      border:1px solid #444;
      border-radius:9px;
      padding:13px;
      font:12px/1.5 Consolas,monospace;
      outline:0;
      transition:.2s;
    }

    textarea:focus{
      border-color:var(--gold);
      box-shadow:0 0 0 3px rgba(240,200,95,.12);
    }

    .bar{
      display:flex;
      gap:10px;
      align-items:end;
      flex-wrap:wrap;
      margin-top:13px;
    }

    /* Tombol aksi selalu tampil paling kiri. */
    .bar button{order:-1}

    .field{
      display:grid;
      gap:6px;
      color:var(--muted);
      font-size:11px;
    }

    .field input,
    .field select{
      width:130px;
      padding:10px;
      background:#101012;
      color:#fff;
      border:1px solid #444;
      border-radius:8px;
      outline:0;
    }

    .field select{width:160px}

    .field input:focus,
    .field select:focus{
      border-color:var(--gold);
    }

    button{
      position:relative;
      overflow:hidden;
      border:1px solid #4b4a50;
      border-radius:9px;
      padding:11px 16px;
      background:#28272c;
      color:#fff;
      font-weight:bold;
      cursor:pointer;
      transition:transform .16s,box-shadow .16s,background .16s;
    }

    button:hover{
      transform:translateY(-2px);
      background:#38363d;
      box-shadow:0 7px 18px #0006;
    }

    button:active{
      transform:translateY(1px) scale(.97);
      box-shadow:0 2px 7px #0006;
    }

    button::after{
      content:"";
      position:absolute;
      top:50%;
      left:50%;
      width:0;
      height:0;
      border-radius:50%;
      background:#ffffff42;
      transform:translate(-50%,-50%);
      transition:width .45s,height .45s;
    }

    button:active::after{
      width:250px;
      height:250px;
    }

    button.primary{
      border:0;
      background:linear-gradient(135deg,#ffe39a,var(--gold));
      color:#1c1402;
      box-shadow:0 4px 14px #f0c85f33;
    }

    button.primary:hover{
      background:linear-gradient(135deg,#fff0b9,#f2bc3b);
      box-shadow:0 8px 23px #f0c85f57;
    }

    .summary{
      display:grid;
      grid-template-columns:repeat(5,minmax(130px,1fr));
      gap:10px;
      margin-bottom:18px;
    }

    .sum{
      border:1px solid #444;
      border-radius:9px;
      padding:12px;
      background:#141418;
    }

    .sum small{color:var(--muted)}

    .sum b{
      display:block;
      margin-top:5px;
      font-size:21px;
    }

    .table-wrap{
      overflow:auto;
      max-height:620px;
      border:1px solid #303036;
      border-radius:9px;
      -webkit-overflow-scrolling:touch;
    }

    table{
      border-collapse:collapse;
      width:100%;
      min-width:1130px;
      background:#141418;
    }

    th,td{
      padding:11px 10px;
      border-bottom:1px solid #333;
      text-align:left;
      vertical-align:top;
    }

    th{
      position:sticky;
      top:0;
      z-index:1;
      background:#252329;
      color:var(--gold-light);
      font-size:11px;
    }

    tr:hover td{background:#202026}

    .name{
      min-width:300px;
      font-weight:bold;
    }

    .meta,.note{
      font-size:11px;
      color:var(--muted);
      line-height:1.4;
      margin-top:5px;
    }

    .note{max-width:260px}

    .money{
      white-space:nowrap;
      font-variant-numeric:tabular-nums;
    }

    .pct{font-weight:bold}

    .badge{
      display:inline-block;
      border-radius:999px;
      padding:5px 8px;
      font-size:11px;
      font-weight:bold;
      white-space:nowrap;
    }

    .mahal{background:#441c24;color:#ffabb2}
    .hold-history{background:#4a3916;color:#ffd982}
    .hold{background:#40371d;color:#ffe18e}
    .go{background:#133d2d;color:#9cf0c5}
    .watch{background:#1d3150;color:#aaccff}
    .active{background:#303644;color:#d3d8e1}
    .scheduled{background:#3e3519;color:#ffe18e}

    .danger{background:#261319}
    .danger td{border-color:#542a32}
    .danger .name{color:#ffb1b6}

    .empty{
      text-align:center;
      color:var(--muted);
      padding:26px;
    }

    @media(max-width:700px){
      main{padding:18px 12px}

      .summary{
        grid-template-columns:repeat(2,1fr);
      }

      h1{font-size:22px}

      .bar{
        display:grid;
        grid-template-columns:1fr 1fr;
      }

      .bar>*{min-width:0}

      .field input,
      .field select{
        width:100%;
      }

      .bar button{min-height:44px}

      .card{padding:13px}

      textarea{min-height:245px}

      .table-wrap{max-height:480px}
    }
  </style>
</head>

<body>
<main>
  <h1>FILTER <span>IKLAN ADS MKT328</span></h1>

  </p>

  <section class="card">
    <textarea id="raw" placeholder="Paste data RAW campaign di sini..."></textarea>

    <div class="bar">
      <label class="field">
        CPR mahal di atas
        <input id="cprLimit" type="number" value="5" step=".01">
      </label>

      <label class="field">
        Mulai cek mahal (%)
        <input id="earlyPct" type="number" value="9" step="1">
      </label>

      <label class="field">
        Batas lanjut (%)
        <input id="goPct" type="number" value="20" step="1">
      </label>

      <label class="field">
        Pengecualian setelah (%)
        <input id="historyPct" type="number" value="15" step="1">
      </label>

      <label class="field">
        CPR MAX murah di bawah
        <input id="historyCpr" type="number" value="4" step=".01">
      </label>

      <label class="field">
        Filter situs
        <select id="siteFilter">
          <option value="ALL">Semua situs</option>
          <option value="EDUTOTO">EDUTOTO</option>
          <option value="AMPER88">AMPER88</option>
          <option value="SHOPISLOT">SHOPISLOT</option>
          <option value="LAINNYA">LAINNYA</option>
        </select>
      </label>

      <label class="field">
        Cari No Akun
        <input id="accountFilter" type="search" placeholder="Contoh: 1281">
      </label>

      <button class="primary" id="process">⚡ FILTER SEKARANG</button>
      <button id="clear">✕ HAPUS DATA</button>
    </div>
  </section>

  <section class="summary" id="summary"></section>

  <section class="card" style="padding:12px">
    <b>HASIL FILTER IKLAN ADS</b>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>No Akun</th>
            <th>Situs / Agency</th>
            <th>Campaign & Link</th>
            <th>Budget</th>
            <th>Spend Saat Ini</th>
            <th>% Budget</th>
            <th>Result</th>
            <th>CPR Saat Ini</th>
            <th>CPR Max</th>
            <th>CPM</th>
            <th>CPC</th>
            <th>Penjelasan</th>
          </tr>
        </thead>

        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  const money = number => Number.isFinite(number)
    ? '$' + number.toLocaleString('en-US',{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
    : '—';

  function num(value){
    if(value == null) return null;

    const text = String(value)
      .replace(/[$,\s]/g,'')
      .trim();

    if(
      !text ||
      /active|scheduled|preparing|pending|review/i.test(text)
    ){
      return null;
    }

    const parsed = parseFloat(text);

    return Number.isFinite(parsed) ? parsed : null;
  }

  function valueOf(block,label){
    const escaped = label.replace(
      /[.*+?^${}()|[\]\\]/g,
      '\\$&'
    );

    const regex = new RegExp(
      '(?:^|\\n)\\s*' + escaped + '\\s*:\\s*([^\\n\\r]*)',
      'i'
    );

    const match = block.match(regex);

    return match ? match[1].trim() : '';
  }

  function detectSite(text){
    const upper = String(text).toUpperCase();

    if(
      upper.includes('EDUTOTO') ||
      upper.includes('ZUMYXEDU') ||
      upper.includes('EDU GMT')
    ){
      return 'EDUTOTO';
    }

    if(upper.includes('AMPER88') || /^AMP/i.test(upper)){
      return 'AMPER88';
    }

    if(upper.includes('SHOPISLOT') || /^SHP/i.test(upper)){
      return 'SHOPISLOT';
    }

    return 'LAINNYA';
  }

  function detectAgency(firstLine){
    const upper = firstLine.toUpperCase();

    if(upper.startsWith('EDUTOTOXBGPM')) return 'BGPM';
    if(upper.startsWith('EDUTOTOXLUNA')) return 'LUNA';
    if(upper.startsWith('ZUMYXEDU')) return 'ZUMY';

    const beforeGmt = firstLine.split(/GMT/i)[0].trim();

    return beforeGmt || '—';
  }

  function parse(raw){
    const lines = raw.split(/\r?\n/);

    /*
      Campaign baru dimulai jika dalam baris ada nomor akun:
      (1281), (0041), (4157), dan lainnya.
    */
    const startIndexes = [];

    lines.forEach((line,index) => {
      if(/\(\s*\d{3,8}\s*\)/.test(line)){
        startIndexes.push(index);
      }
    });

    if(!startIndexes.length) return [];

    const output = [];

    startIndexes.forEach((start,index) => {
      const end = startIndexes[index + 1] || lines.length;
      const block = lines.slice(start,end).join('\n').trim();

      if(!block) return;

      const first = lines[start].trim();
      const accountMatch = first.match(/\(\s*(\d{3,8})\s*\)/);

      if(!accountMatch) return;

      const account = accountMatch[1];
      const site = detectSite(first);
      const agency = detectAgency(first);

      const gmtMatch = first.match(/GMT\s*([+-]\s*\d+)/i);

      const gmt = gmtMatch
        ? gmtMatch[1].replace(/\s/g,'')
        : '—';

      /*
        Budget hanya mengambil nominal di atas $100 pada judul campaign.
        Nominal kecil seperti BC $4.50 atau $5.00 bukan budget.
        Contoh: (7037) BC $4.5 $1000... → budget $1000.
      */
      const moneyMatches = [
        ...first.matchAll(/\$\s*([\d,.]+)/g)
      ];

      const budget = moneyMatches
        .map(match => num(match[1]))
        .find(value => value !== null && value > 100) ?? null;

      const spendMaxText = valueOf(block,'SPEND MAX');
      const statusText = [
        valueOf(block,'STATUS'),
        valueOf(block,'ON/OFF'),
        spendMaxText
      ].join(' ');

      const inactive = /\b(?:off|disabled)\b/i.test(
        first + ' ' + statusText
      );

      if(inactive) return;

      const link = (
        block.match(/LINK ADS\s*:\s*(https?:\/\/\S+)/i) || []
      )[1] || '';

      output.push({
        first,
        account,
        site,
        agency,
        gmt,
        budget,
        spend:num(valueOf(block,'SPEND')),
        cpr:num(valueOf(block,'CPR')),
        cprMax:num(valueOf(block,'CPR MAX')),
        result:num(valueOf(block,'RESULT')),
        cpm:num(valueOf(block,'CPM')),
        cpc:num(valueOf(block,'CPC')),
        link,
        active:/active/i.test(spendMaxText),
        preparing:/preparing/i.test(spendMaxText),
        scheduled:/scheduled/i.test(spendMaxText),
        review:/review|in review/i.test(statusText)
      });
    });

    return output;
  }

  function settings(){
    return {
      limit:+$('cprLimit').value || 5,
      early:(+$('earlyPct').value || 9) / 100,
      go:(+$('goPct').value || 20) / 100,
      hist:(+$('historyPct').value || 15) / 100,
      histCpr:+$('historyCpr').value || 4
    };
  }

  function status(item,setting){
    if(item.scheduled){
      return {
        key:'scheduled',
        label:'SCHEDULED',
        note:'Campaign sudah dijadwalkan dan belum mulai spend.'
      };
    }

    if(item.review){
      return {
        key:'watch',
        label:'IN REVIEW',
        note:'Campaign sedang dalam proses review.'
      };
    }

    if(item.spend === null || item.spend === 0){
      return {
        key:'active',
        label:item.preparing
          ? 'PREPARING'
          : item.active
            ? 'ACTIVE — BELUM ADA SPEND'
            : 'BELUM ADA DATA',
        note:'Belum ada spend atau CPR untuk dianalisis.'
      };
    }

    const percentBudget = item.budget
      ? item.spend / item.budget
      : null;

    if(
      percentBudget !== null &&
      percentBudget >= .10 &&
      item.cpr === null
    ){
      return {
        key:'mahal',
        label:'IKLAN MAHAL',
        note:'Spend sudah 10% budget, tetapi CPR belum keluar.'
      };
    }

    if(!item.result || item.result <= 0){
      return {
        key:'watch',
        label:'BELUM ADA HASIL',
        note:'Spend sudah jalan, tetapi result belum muncul.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget > setting.hist &&
      item.cpr > setting.limit &&
      item.cprMax !== null &&
      item.cprMax < setting.histCpr
    ){
      return {
        key:'hold-history',
        label:'TAHAN DULU',
        note:'Kemarin masih dapat murah: CPR MAX ' +
          money(item.cprMax) + '.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= setting.early &&
      item.cpr > setting.limit
    ){
      return {
        key:'mahal',
        label:'IKLAN MAHAL',
        note:'CPR ' + money(item.cpr) +
          ' di atas batas ' + money(setting.limit) + '.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= setting.go &&
      item.cpr <= setting.limit
    ){
      return {
        key:'go',
        label:'LANJUTKAN',
        note:'Lolos evaluasi ' +
          Math.round(setting.go * 100) +
          '% budget dengan CPR aman.'
      };
    }

    if(
      percentBudget !== null &&
      percentBudget >= .10 &&
      item.cpr <= setting.limit
    ){
      return {
        key:'hold',
        label:'TAHAN DULU',
        note:'CPR aman. Tahan sampai ' +
          Math.round(setting.go * 100) +
          '% budget.'
      };
    }

    return {
      key:'watch',
      label:'PANTAU',
      note:percentBudget === null
        ? 'Budget tidak terbaca.'
        : 'Spend belum masuk batas evaluasi.'
    };
  }

  function run(){
    const setting = settings();
    const selectedSite = $('siteFilter').value;
    const accountQuery = $('accountFilter').value.trim();

    let data = parse($('raw').value).map(item => ({
      ...item,
      st:status(item,setting)
    }));

    if(selectedSite !== 'ALL'){
      data = data.filter(item => item.site === selectedSite);
    }

    if(accountQuery){
      data = data.filter(item =>
        item.account.includes(accountQuery)
      );
    }

    const ranking = {
      mahal:0,
      'hold-history':1,
      hold:2,
      watch:3,
      go:4,
      scheduled:5,
      active:6
    };

    data.sort((a,b) =>
      ranking[a.st.key] - ranking[b.st.key] ||
      (b.cpr ?? -1) - (a.cpr ?? -1)
    );

    const totalSpend = data.reduce(
      (total,item) => total + (item.spend || 0),
      0
    );

    const expensiveCount = data.filter(
      item => item.st.key === 'mahal'
    ).length;

    const holdCount = data.filter(
      item =>
        item.st.key === 'hold-history' ||
        item.st.key === 'hold'
    ).length;

    const continueCount = data.filter(
      item => item.st.key === 'go'
    ).length;

    $('summary').innerHTML = [
      ['CAMPAIGN TERBACA',data.length,''],
      ['TOTAL SPEND',money(totalSpend),''],
      ['IKLAN MAHAL',expensiveCount,'color:var(--red)'],
      ['TAHAN DULU',holdCount,'color:var(--yellow)'],
      ['LANJUTKAN',continueCount,'color:var(--green)']
    ].map(item => `
      <div class="sum">
        <small>${item[0]}</small>
        <b style="${item[2]}">${item[1]}</b>
      </div>
    `).join('');

    $('rows').innerHTML = data.length
      ? data.map(item => {
          const percentBudget =
            item.budget && item.spend !== null
              ? item.spend / item.budget
              : null;

          const blank = value =>
            Number.isFinite(value) ? money(value) : '';

          const campaign = item.first.replace(/</g,'&lt;');

          const cprColor = item.cpr > setting.limit
            ? 'var(--red)'
            : item.cpr > 0
              ? 'var(--green)'
              : 'var(--muted)';

          return `
            <tr class="${item.st.key === 'mahal' ? 'danger' : ''}">
              <td>
                <span class="badge ${item.st.key}">
                  ${item.st.label}
                </span>
              </td>

              <td>
                <b style="font-size:16px">${item.account}</b>
                <div class="meta">GMT ${item.gmt}</div>
              </td>

              <td>
                <b>${item.site}</b>
                <div class="meta">Agency: ${item.agency}</div>
              </td>

              <td class="name">
                ${campaign}
                <div class="meta">
                  ${
                    item.link
                      ? `<a href="${item.link}" target="_blank" rel="noreferrer" style="color:#8bbcff">${item.link}</a>`
                      : 'Link tidak ada'
                  }
                </div>
              </td>

              <td class="money">${blank(item.budget)}</td>

              <td class="money">
                ${
                  item.scheduled
                    ? 'SCHEDULED'
                    : item.preparing && item.spend === null
                      ? 'PREPARING'
                      : item.active && item.spend === null
                        ? 'ACTIVE'
                        : blank(item.spend)
                }
              </td>

              <td class="pct">
                ${
                  percentBudget === null
                    ? ''
                    : (percentBudget * 100).toFixed(2) + '%'
                }
              </td>

              <td>${item.result ?? ''}</td>

              <td class="money" style="color:${cprColor}">
                <b>${blank(item.cpr)}</b>
              </td>

              <td class="money">${blank(item.cprMax)}</td>
              <td class="money">${blank(item.cpm)}</td>
              <td class="money">${blank(item.cpc)}</td>

              <td>
                <div class="note">${item.st.note}</div>
              </td>
            </tr>
          `;
        }).join('')
      : `
        <tr>
          <td colspan="13" class="empty">
            Data tidak terbaca. Pastikan setiap campaign memiliki nomor akun,
            misalnya: (1281), (0041), atau (4157).
          </td>
        </tr>
      `;

    localStorage.setItem('adsFilterRaw',$('raw').value);
  }

  $('process').onclick = run;

  $('clear').onclick = () => {
    $('raw').value = '';
    localStorage.removeItem('adsFilterRaw');
    run();
  };

  $('siteFilter').onchange = run;
  $('accountFilter').oninput = run;

  $('raw').value = localStorage.getItem('adsFilterRaw') || '';

  run();
</script>
</body>
</html>
